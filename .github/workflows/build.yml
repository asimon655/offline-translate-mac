name: Build

# Every push and pull request: run the tests and build the app.
# A tag like v0.1.0 or v0.1.0-beta.1: also build the DMG and publish a GitHub release
# (tags with a "-" suffix are marked as pre-releases).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The offline-translate library that gets bundled into the app.
  LIB_REPO: asimon655/offline-translate
  LIB_REF: main

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-app.sh uses the commit count as the build number

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LIB_REPO }}
          ref: ${{ env.LIB_REF }}
          path: .lib/offline-translate

      - uses: astral-sh/setup-uv@v6

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: scripts/swift test

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(cat packaging/version)-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Build app and DMG
        env:
          LIB_DIR: ${{ github.workspace }}/.lib/offline-translate
        run: scripts/build-app.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslate-${{ env.VERSION }}
          path: |
            dist/OfflineTranslate-*.dmg
            dist/offline-translate.rb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/OfflineTranslate-"$VERSION".dmg dist/offline-translate.rb \
            --title "Offline Translate $VERSION" --generate-notes "${PRERELEASE[@]}" \
            --notes-file packaging/release-notes.md
